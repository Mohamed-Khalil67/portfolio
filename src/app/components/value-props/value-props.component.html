<section class="value-section">
  <p class="section-eyebrow">Why work with me</p>
  <h2 class="section-title">Websites built to sell, not just to look good</h2>
  <p class="section-subtitle">
    Every build is focused on one outcome: turning your visitors into paying customers.
  </p>

  <div class="value-grid">
    @for (prop of props; track prop.title) {
      <article class="value-card" [ngStyle]="gradient(prop.color)">
        <div class="value-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            @for (d of prop.iconPaths; track d) {
              <path [attr.d]="d"/>
            }
          </svg>
        </div>
        <h3 class="value-card-title">{{ prop.title }}</h3>
        <p class="value-card-text">{{ prop.description }}</p>
      </article>
    }
  </div>
</section>
