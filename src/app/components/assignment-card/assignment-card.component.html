<div class="assignment-card" [ngStyle]="cardStyle" (click)="openInNewTab($event)">

  <div class="card-preview">

    <div class="preview-loader" [class.hidden]="iframeLoaded">
      <div class="spinner"></div>
    </div>

    @if (iframeVisible) {
      <iframe [src]="safePreviewUrl" (load)="onIframeLoad()" [class.loaded]="iframeLoaded"
        loading="lazy" aria-hidden="true" tabindex="-1"></iframe>
    }

    <div class="preview-footer">
      <span class="preview-title">{{ assignment.title }}</span>
      <button class="preview-detail-btn" (click)="requestDetail($event)">Details</button>
    </div>

  </div>

</div>
